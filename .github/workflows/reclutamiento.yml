name: Reclutamiento de agente

on: push

jobs:
  reporte-de-reclutamiento:
    runs-on: ubuntu-latest

    steps:
      - name: el afgente se presenta
        run: echo "El agente se presenta"

      - name: Reporte de indentidad
        run: |
          echo "El agente reporta su identidad"
          echo "=============================="
          echo ""
          echo "Contexto Github"
          echo "Repositorio: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Evento: ${{ github.event_name }}"
          echo "SHA: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"
          echo "Actor ID: ${{ github.actor_id }}"
          echo "Metadata: ${{ toJson(github) }}"
          echo "=============================="

      - name: Capacidades del agente
        run: |
          echo "Capacidades detectadas"
          echo "=============================="
          echo ""
          echo "Sistema operativo"
          uname -a
          echo ""
          echo "Habilidades técnicas"
          git --version
          node --version
          python3 --version
          echo "=============================="

      - name: Reconocimiento del terreno
        run: |
          echo "Reconociendo el terreno"
          ls /

      - name: Despedida del agente
        run: echo "El agente se despide"
