name: 🌋 Acceso fortaleza

on: push

jobs:
  acceso-fortaleza-prohibida:
    runs-on: ubuntu-latest

    steps:
      - name: el afgente llega a la fortaleza
        run: |
          echo "El agente ${{ github.actor }} llega a la fortaleza"
          echo ""
          echo "Buscar archivos de la legión"
          ls -la
          echo ""
          echo "❎ pero que pasó no hay nada"

      - name: revisar el contenido del repositorio
        uses: actions/checkout@v4

      - name: Veamos los planes ahora
        run: |
          echo "Contenido del repositorio después del checkout:"
          ls -la
          echo "✅ funciona"
          echo ""
          echo "planes de la legión:"
          ls planes/
          echo ""
          echo "Villanos:"
          ls miembros/
          echo ""
          echo "Inteligencia:"
          ls inteligencia/
