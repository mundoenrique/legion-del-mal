name: Control de Calidad
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  revision-de-calidad:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: El consejoi revisa los cambios
        run: |
          chmod +x scripts/validar-planes.sh
          ./scripts/validar-planes.sh
